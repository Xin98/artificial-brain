openapi: 3.1.1
info:
  title: Artificial Brain Todo API
  version: 0.1.0
paths:
  /api/v1/todos:
    get:
      operationId: listTodos
      responses:
        '200':
          description: Matching todos, capped at 200; deleted never listed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoList'
        '401':
          description: Missing or invalid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Invalid filter parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createTodo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTodoRequest'
      responses:
        '201':
          description: Todo created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '401':
          description: Missing or invalid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Invalid title, due instant, or body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/todos/{todoId}:
    get:
      operationId: getTodo
      responses:
        '200':
          description: The todo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '401':
          description: Missing or invalid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Todo not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: updateTodo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTodoRequest'
      responses:
        '200':
          description: Updated todo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '401':
          description: Missing or invalid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Todo not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Version conflict or terminal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/todos/{todoId}/complete:
    post:
      operationId: completeTodo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: Completed todo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '401':
          description: Missing or invalid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Todo not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Version conflict or terminal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, correlationId]
      properties:
        code:
          type: string
        message:
          type: string
        correlationId:
          type: string
    Todo:
      type: object
      additionalProperties: false
      required: [id, title, status, overdue, reminderVersion, version, createdAt, updatedAt]
      properties:
        id:
          type: string
        title:
          type: string
          maxLength: 200
        description:
          type: string
        dueAtUtc:
          type: string
          format: date-time
        timezoneAtInput:
          type: string
        status:
          type: string
          enum: [pending, completed]
        overdue:
          type: boolean
        reminderVersion:
          type: integer
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
    TodoList:
      type: object
      additionalProperties: false
      required: [todos]
      properties:
        todos:
          type: array
          items:
            $ref: '#/components/schemas/Todo'
    CreateTodoRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
        dueAtUtc:
          type: string
          format: date-time
        timezoneAtInput:
          type: string
    UpdateTodoRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
        title:
          type: string
          maxLength: 200
        description:
          type: string
        dueAtUtc:
          type: string
          format: date-time
        timezoneAtInput:
          type: string
    VersionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
