openapi: 3.1.1
info:
  title: Artificial Brain Dashboard API
  version: 0.1.0
paths:
  /api/v1/dashboard/summary:
    get:
      operationId: getDashboardSummary
      responses:
        '200':
          description: Deterministic counters for the caller's workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401':
          description: Missing or invalid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Missing or invalid timezone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, correlationId]
      properties:
        code:
          type: string
        message:
          type: string
        correlationId:
          type: string
    DashboardSummary:
      type: object
      additionalProperties: false
      required:
        - pendingTotal
        - dueToday
        - overdue
        - noDue
        - completedLast7Days
        - reminderRetrying
        - reminderFailed
        - checkedAt
      properties:
        pendingTotal:
          type: integer
        dueToday:
          type: integer
        overdue:
          type: integer
        noDue:
          type: integer
        completedLast7Days:
          type: integer
        reminderRetrying:
          type: integer
        reminderFailed:
          type: integer
        checkedAt:
          type: string
          format: date-time
