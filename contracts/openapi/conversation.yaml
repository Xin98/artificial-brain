openapi: 3.1.1
info:
  title: Artificial Brain Conversation API
  version: 0.1.0
paths:
  /api/v1/conversation/messages:
    post:
      operationId: postConversationMessage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationMessageRequest'
      responses:
        '200':
          description: The resolved outcome of the turn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '401':
          description: Missing or invalid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The requested conversation session does not exist or belongs to someone else.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Missing or oversized text, or missing timezone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/conversation/sessions:
    get:
      operationId: listConversationSessions
      parameters:
        - in: query
          name: offset
          description: Zero-based offset into the most recently active session list.
          schema:
            type: integer
            minimum: 0
            maximum: 2147483546
            default: 0
      responses:
        '200':
          description: The caller's conversation sessions, most recently active first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '422':
          description: Invalid pagination offset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createConversationSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
      responses:
        '201':
          description: The created conversation session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '401':
          description: Missing or invalid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Title is blank or oversized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/conversation/sessions/{sessionId}/messages:
    get:
      operationId: getConversationHistory
      parameters:
        - in: query
          name: before
          description: Exclusive decimal message ID cursor; absent returns the latest page.
          schema:
            type: string
            pattern: '^[0-9]+$'
      responses:
        '200':
          description: The session transcript, oldest message first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionHistoryResponse'
        '422':
          description: Invalid message cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/conversation/sessions/{sessionId}:
    patch:
      operationId: renameConversationSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRenameRequest'
      responses:
        '200':
          description: The renamed conversation session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '401':
          description: Missing or invalid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Title is blank or oversized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: deleteConversationSession
      responses:
        '204':
          description: Session and its messages deleted.
        '401':
          description: Missing or invalid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/confirmations:
    post:
      operationId: createConfirmation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationRequest'
      responses:
        '201':
          description: Confirmation created, bound to the todo version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationCreated'
        '401':
          description: Missing or invalid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Todo not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Todo is not pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/confirmations/{confirmationId}/confirm:
    post:
      operationId: confirmAction
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmActionRequest'
      responses:
        '200':
          description: The confirmed action executed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '401':
          description: Missing or invalid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Confirmation not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Confirmation consumed or todo version stale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          description: Confirmation expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Invalid confirmation body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, correlationId]
      properties:
        code:
          type: string
        message:
          type: string
        correlationId:
          type: string
    ConversationMessageRequest:
      type: object
      additionalProperties: false
      required: [text, timezone]
      properties:
        text:
          type: string
          maxLength: 1000
        timezone:
          type: string
        sessionId:
          type: string
    ConfirmationRequest:
      type: object
      additionalProperties: false
      required: [intent, todoId]
      properties:
        intent:
          type: string
          enum: [todo.delete]
        todoId:
          type: string
    ConfirmationCreated:
      type: object
      additionalProperties: false
      required: [confirmationId, expiresAt]
      properties:
        confirmationId:
          type: string
        expiresAt:
          type: string
          format: date-time
    ConfirmActionRequest:
      type: object
      additionalProperties: false
      properties:
        sessionId:
          type: string
          description: Owned conversation session receiving the committed deletion outcome; optional for legacy clients.
    ConversationResponse:
      type: object
      additionalProperties: false
      required: [kind, correlationId]
      properties:
        kind:
          type: string
          enum:
            - todo_created
            - clarification
            - candidates
            - confirmation_required
            - todo_list
            - todo_deleted
            - not_found
            - unsupported
            - chat
        correlationId:
          type: string
        reply:
          type: string
          maxLength: 2000
        sessionId:
          type: string
        todo:
          $ref: '#/components/schemas/TodoView'
        resolvedDueAtUtc:
          type: string
          format: date-time
        localEcho:
          type: string
        timezoneEcho:
          type: string
        missingFields:
          type: array
          items:
            type: string
        candidates:
          type: array
          description: Matching todo titles and dates; includes the single target for confirmation_required.
          items:
            $ref: '#/components/schemas/Candidate'
        confirmationId:
          type: string
        expiresAt:
          type: string
          format: date-time
        todos:
          type: array
          items:
            $ref: '#/components/schemas/TodoView'
        todoId:
          type: string
    Candidate:
      type: object
      additionalProperties: false
      required: [todoId, title, version]
      properties:
        todoId:
          type: string
        title:
          type: string
        dueAtUtc:
          type: string
          format: date-time
        version:
          type: integer
    TodoView:
      type: object
      additionalProperties: false
      required: [id, title, status, overdue, reminderVersion, version, createdAt, updatedAt]
      properties:
        id:
          type: string
        title:
          type: string
          maxLength: 200
        description:
          type: string
        dueAtUtc:
          type: string
          format: date-time
        timezoneAtInput:
          type: string
        status:
          type: string
          enum: [pending, completed]
        overdue:
          type: boolean
        reminderVersion:
          type: integer
        reminderScheduled:
          type: boolean
          description: Whether this command scheduled deliveries; false with no usable channels. Omitted when scheduling state is unknown.
        reminderChannels:
          type: array
          items:
            type: string
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
    SessionView:
      type: object
      additionalProperties: false
      required: [id, title, createdAt, updatedAt]
      properties:
        id:
          type: string
        title:
          type: string
          maxLength: 50
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SessionListResponse:
      type: object
      additionalProperties: false
      required: [sessions, hasMore]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionView'
        hasMore:
          type: boolean
        nextOffset:
          type: integer
          minimum: 0
    SessionCreateRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 50
    SessionRenameRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 50
    SessionHistoryResponse:
      type: object
      additionalProperties: false
      required: [sessionId, title, messages, hasMore]
      properties:
        sessionId:
          type: string
        title:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageView'
        hasMore:
          type: boolean
        nextBefore:
          type: string
          description: Exclusive cursor for the next older page; first visible message ID. Present only when hasMore is true.
    MessageView:
      type: object
      additionalProperties: false
      required: [id, role, body, createdAt]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant]
        body:
          type: string
        resolvedIntent:
          type: string
        createdAt:
          type: string
          format: date-time
